[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bipia-offline-preflight"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["tiktoken==0.14.0", "nltk==3.9.2", "langdetect==1.0.9", "thefuzz==0.22.1", "emoji==2.15.0"]

[tool.setuptools]
packages = ["preflight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
